# Hand-curated patient-group / registry seed file.
# README hard rule 2: names and search terms only — the pipeline resolves IDs.
# Every row in `groups` was verified by fetching its URL on meta.date.
# Every directory search is logged in `searches`, including zero hits and
# blocked fetches. `hits` counts on-topic results for the query's goal
# (e.g. a dedicated STAT1 GoF group); raw result noise is described in
# `outcome`. null hits = the search could not be executed/read.

meta:
  curated_by: "team"
  date: "2026-10-03"
  rule: "every group row verified by fetching url on date; searches logged including zero hits"

groups:
  - name: "Immune Deficiency Foundation"
    url: "https://primaryimmune.org/"
    kind: patient_group
    diseases:
      - "primary immunodeficiency (umbrella)"
      - "STAT1 gain of function"
      - "STAT3 gain of function"
      - "severe combined immunodeficiency"
    scope: umbrella
    verified:
      retrieved_at: "2026-10-03"
      method: webfetch
      note: >-
        Homepage fetched. Stated purpose: improve the diagnosis, treatment,
        and quality of life for every person affected by primary
        immunodeficiency; peer support, Ask IDF, education. The STAT1/STAT3
        GoF handbook chapter page was fetched separately the same day and
        exists: "Chapter 15: Diseases of Immune Dysregulation: STAT1 and
        STAT3 Gain of Function" (IDF Patient & Family Handbook, 6th edition,
        page dated 2019-06-30; download gated behind a name/email form) at
        https://primaryimmune.org/resources/print-material/chapter-15-diseases-of-immune-dysregulation
    source_of_claim: >-
      test-cluster-desc.md section 5 (Retrieved); confirmed by fetching both
      URLs on 2026-10-03.

  - name: "USIDNET (United States Immunodeficiency Network)"
    url: "https://usidnet.org/"
    kind: registry
    diseases:
      - "primary immunodeficiency / inborn errors of immunity (umbrella)"
    scope: umbrella
    verified:
      retrieved_at: "2026-10-03"
      method: webfetch
      note: >-
        usidnet.org returned HTTP 301 to https://www.usidnet.net/, which was
        fetched. The site describes USIDNET as a research consortium on
        inborn errors of immunity that maintains a patient registry
        ("connects registry data, clinicians, researchers, and participating
        institutions"). Funding as stated on the site: primary support from
        an NIH grant (R24AI171055, as printed on the page) administered
        through NIAID; the Immune Deficiency Foundation provides additional
        support for the website and network operations. This differs
        slightly from the cluster doc's phrasing ("an IDF program"); the
        fetched page frames IDF as a supporter, not the operator.
    source_of_claim: >-
      test-cluster-desc.md section 5 (Retrieved); confirmed by fetching the
      redirect target https://www.usidnet.net/ on 2026-10-03.

  - name: "Jeffrey Modell Foundation"
    url: "https://info4pi.org/"
    kind: foundation
    diseases:
      - "primary immunodeficiency (umbrella)"
    scope: umbrella
    verified:
      retrieved_at: "2026-10-03"
      method: webfetch
      note: >-
        Homepage fetched. Stated mission: "Accelerating earliest possible
        diagnosis, connecting patients to life-changing treatments, and
        finding cures for Primary Immunodeficiency." Operates the Jeffrey
        Modell Centers Network (JMCN) providing access to expert
        immunologists and research resources; also research/education
        grants and genetic sequencing programs. This resolves the cluster
        doc's "role needs checking" flag: the site confirms it supports a
        network of diagnostic and research centers for PI.
    source_of_claim: >-
      test-cluster-desc.md section 5 (role flagged as needing checking);
      role confirmed by fetching https://info4pi.org/ on 2026-10-03.

  - name: "SCID Foundation"
    url: "https://www.scidfoundation.org/"
    kind: foundation
    diseases:
      - "severe combined immunodeficiency (SCID)"
    scope: dedicated
    verified:
      retrieved_at: "2026-10-03"
      method: webfetch
      note: >-
        Found via NORD's organization directory (entry at
        https://rarediseases.org/organizations/scid-foundation/, fetched
