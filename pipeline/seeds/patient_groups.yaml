gaps:
  - statement: >-
      No patient group dedicated to STAT1 gain of function alone was found
      in any directory successfully searched on 2026-10-03 (NORD on-site,
      EURORDIS on-site, Genetic Alliance UK on-site, plus domain-restricted
      web searches of NORD and Global Genes). The closest existing
      communities are umbrella primary-immunodeficiency organizations:
      Immune Deficiency Foundation (which publishes a STAT1/STAT3 GoF
      handbook chapter), USIDNET (registry), and the Jeffrey Modell
      Foundation. This claim is bounded: Orphanet was bot-blocked,
      RareConnect would not render, and Disease InfoSearch could not be
      queried, so absence in those three is NOT established.
    basis:
      - "NORD on-site search (hits: 0)"
      - "NORD domain-restricted web search (hits: 0)"
      - "Global Genes on-site search (0 shown; JS caveat)"
      - "Global Genes domain-restricted web search (hits: 0)"
      - "EURORDIS on-site search (explicit 0)"
      - "Genetic Alliance UK on-site search (explicit 0)"
      - "Orphanet: blocked (both URLs)"
      - "RareConnect: not readable"
      - "Disease InfoSearch: not executed"
    next_step: >-
      Retry Orphanet (its patient-organisation listings) and RareConnect
      with a real JavaScript-rendering browser or an API; query Disease
      InfoSearch interactively; ask IDF/USIDNET whether a STAT1-GoF-specific
      community or registry cohort exists; if the gap holds, the honest-gap
      output is "no dedicated group exists; the closest are IDF, USIDNET and
      JMF; the IDF handbook chapter authors and USIDNET are who could help
      build one."

  - statement: >-
      SCID Angels for Life Foundation (angels.scid.net) is a known SCID
      group lead but is UNVERIFIED: its site returned HTTP 503
      (Retry-After 3600) on 2026-10-03.
    basis:
      - "Web search engine (general) — SCID group resolution"
    next_step: >-
      Retry the fetch after the Retry-After window; if it verifies, add it
      as a group row with its own retrieved_at.

  - statement: >-
      Neither fetched MPN organization page mentions JAK2. The JAK2-MPN
      ("JAK2-driven blood cancers") mechanism link used in the cluster doc
      must be established by the literature/variant pipeline, not by this
      seed file.
    basis:
      - "MPN Research Foundation homepage fetch (2026-10-03)"
      - "MPN Advocacy & Education International homepage fetch (2026-10-03)"
    next_step: >-
      Connect MPN diseases to the JAK2 somatic mechanism node via
      retrieved sources (ClinVar/PubMed), then attach these groups to the
      disease nodes by plain-language disease name.

  - statement: >-
      usidnet.org permanently redirects (HTTP 301) to www.usidnet.net. The
      seed keeps the .org URL from the cluster doc as the stable entry
      point, but consumers should expect the .net landing site.
    basis:
      - "usidnet.org fetch (301) and www.usidnet.net fetch, both 2026-10-03"
    next_step: >-
      Pipeline should follow redirects when resolving this row; record the
      final URL in the graph node's props.
