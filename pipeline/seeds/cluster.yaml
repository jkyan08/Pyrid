# Seeds for the JAK-STAT test cluster (docs/test-cluster-desc.md section 3).
#
# NAMES ONLY (README hard rule 2): HGNC gene symbols, disease names and drug names. The source
# loaders resolve each name to a backbone id by exact, case-insensitive match on node label and
# synonyms and record how it was resolved. A term that matches nothing becomes a coverage row
# with hits 0 (hard rule 3); it is never replaced by a guessed id. Disease names below are taken
# from the cluster doc and from node labels / synonyms observed in the backbone during the spike
# (docs/optimuskg-spike.md sections 1 and 4).

genes:  # each must resolve to exactly one Gene node (spike exit criterion 1)
  - STAT1
  - STAT3
  - JAK1
  - JAK2
  - JAK3
  - TYK2
  - IL2RG

disease_terms:  # matched case-insensitively against Disease label and synonyms
  - chronic mucocutaneous candidiasis
  - immunodeficiency 31C
  - immunodeficiency 31B
  - STAT1 deficiency
  - Mendelian susceptibility to mycobacterial diseases
  # the autosomal dominant (partial) STAT1 deficiency entity as the backbone names it
  # (docs/optimuskg-spike.md section 4); it carries no seed-gene association that passes the
  # score rule, so without the name it would be absent and no coverage row would record the gap
  - Autosomal dominant mendelian susceptibility to mycobacterial diseases due to a partial deficiency
  - T-B+ severe combined immunodeficiency due to JAK3 deficiency
  - X-linked severe combined immunodeficiency
  - X-linked SCID  # the cluster doc's wording; the backbone lists it as a synonym of "gamma chain deficiency"
  - gamma chain deficiency
  - hyper-IgE recurrent infection syndrome 1, autosomal dominant
  - STAT3 gain of function
  - polycythemia vera
  - essential thrombocythemia
  - primary myelofibrosis
  - immunodeficiency 35

drug_terms:  # names; JAK inhibitors are also found generically: any Drug with an inhibits edge to a JAK-family gene
  - ruxolitinib
  - baricitinib
  - tofacitinib
  - upadacitinib
  - itacitinib

thresholds:
  # OptimusKG disease-gene evidence_score floor. Observed range over all rows: 0.0009095 to
  # 0.9485794 (docs/optimuskg-spike.md section 1); Open Targets' indirect associations make the
  # edge set very dense below this.
  disease_gene_min_score: 0.3
  # Keep a disease-gene edge below the floor when DISGENET is in sources.direct (the loader's
  # slice floor and the mechanism rules' `below_score_threshold` label; pipeline/graph/mechanisms.py).
  keep_disgenet_direct: true

  # --- Export inclusion rule (pipeline/graph/build.py prune_graph; the single definition is
  # pipeline.sources.optimuskg.disease_gene_included). The store keeps the wider slice above so
  # Lane B's resolved endpoints stay resolvable; graph.json keeps a disease-gene edge only when a
  # curated database is among sources.direct AND evidence_score >= disease_gene_min_score, OR
  # evidence_score >= disease_gene_high_score. Seed-gene edges are never pruned (a weak one keeps
  # its `below_score_threshold` label so the UI shows it as weak rather than hiding it).
  # Names as the backbone spells them in sources.direct; a general list, not a per-gene choice.
  disease_gene_curated_sources: [DISGENET, ORPHANET, CLINGEN, OMIM]
  disease_gene_high_score: 0.6
  # A seed gene pulls in at most this many diseases (ranked by evidence_score after the rule);
  # seed-term matches and diseases reached by an evidence edge (ClinVar, ClinicalTrials.gov,
  # claims, patient groups) are anchors regardless. A general cap on backbone density, applied to
  # every seed gene alike (v0 exported 643 diseases and a 40 MB graph.json; 40 gave 170 diseases
  # and 10.1 MB, 25 gives ~146 diseases; the budget for web/public/graph.json is 8 MB).
  max_diseases_per_seed_gene: 25
  # Per exported disease, keep the top N non-seed genes by evidence_score that pass the rule
  # (genes referenced by evidence are always kept). Read by the export (build.py); the loader
  # keeps max_other_genes_per_disease below in the store. 10 kept 447 genes and ~2,970
  # associated_with edges (2 MB); 5 keeps ~240 genes.
  max_genes_per_disease: 5
  # Paper-derived Investigators need at least this many papers (props.n_papers) to be exported;
  # keep_orcid_investigators: true would also export single-paper authors who carry an ORCID
  # (a reliably identified person; without one the match is "low", README section 5). 1 would
  # export everyone with a publishes_on edge; with the 243-paper bundle that is ~1,640 authors
  # (1,388 with a single paper) and ~3 MB of graph.json (build_report.json "sizes"); the ORCID
  # exemption alone added 233 single-paper authors and 0.4 MB; 2 papers exported 250 authors and
  # 1,474 edges (1.0 MB), 3 papers exports ~90 recurring authors and ~760 edges (0.6 MB). So
  # recurring authors (>= 3 papers in the bundle) are exported and the rest stay in the build
  # report counts; ORCIDs are kept on the exported nodes. A general rule, applied to every paper
  # alike. RePORTER investigators (grant PIs) are not affected.
  min_papers_per_investigator: 3
  keep_orcid_investigators: false
  # v0 does not expand a pathway to its other member genes.
  max_pathway_members_to_expand: 0
  # How many is_a parent levels above each seed disease to include.
  include_parent_levels: 1
  # Density safeguards of the OptimusKG loader (pipeline/sources/optimuskg.py docstring). Open
  # Targets propagates associations up the ontology, so without them the 0.3 floor admits ~830
  # diseases for the 7 genes and ~609k disease-gene edges (v3.2).
  # A disease enters through a seed-gene association only when none of its descendants carries
  # a passing association to the same gene; seed-term matches and parents are exempt.
  disease_gene_most_specific: true
  # Per included disease, keep the top N non-seed genes by evidence_score; seed genes never capped.
  max_other_genes_per_disease: 25
  # Per included disease, keep the top N drugs by trial phase; drugs acting on a seed gene or
  # matching a seed drug term never capped.
  max_drugs_per_disease: 25

# Used only to label the pathway family in reports and the UI; never used to filter or by tests.
# Compile with re.IGNORECASE (backbone pathway labels are capitalised, e.g. "Interleukin-6 signaling").
pathway_family_label_regex: "JAK|STAT|interleukin|interferon|cytokine"

# Gap probe: the "obscure gene with no connections" of ground-truth test 6 (README section 8,
# docs/test-cluster-desc.md section 8). The PIPELINE chooses it by the general rule below over the
# whole backbone (pipeline.sources.optimuskg.select_gap_probe); no symbol is written here or in
# code. "HGNC symbol" means the gene node's properties.symbol is present, differs from its Ensembl
# id, is unique among gene nodes and the node carries an HGNC xref. The export
# (pipeline.export.run_gap_probe) writes the gene as a Gene node with props.gap_probe: true, records
# its four backbone counts (all 0) and live ClinVar / ClinicalTrials.gov / NIH RePORTER lookups as
# coverage rows (every call cached; ATLAS_OFFLINE=1 replays), and build_report.json "gap_probe"
# names the chosen symbol for tests/test_ground_truth.py test 6. pipeline/graph/build.py exports
# the node even though it has no edges, so /entity/<gene id> answers no_supported_route with the
# searches shown.
gap_probe:
  enabled: true
  rule: "alphabetically first protein-coding HGNC symbol among backbone genes with zero disease_gene, drug_gene, pathway_gene and biological_process_gene rows"
  biotype: protein_coding
