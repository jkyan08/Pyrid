[project]
name = "rare-disease-atlas"
version = "0.1.0"
description = "Rare Disease Atlas: JAK-STAT MVP. Research navigation, not medical advice."
readme = "README.md"
# optimuskg 1.0.0 requires Python >= 3.12, so the project floor is 3.12 (interpreter pinned in .python-version).
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "optimuskg>=1.0.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
# Virtual project: pipeline/ and api/ are plain top-level packages imported from the repo root.
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["network: hits a live service; set ATLAS_NETWORK_TESTS=1 to run"]
# pytest-timeout: a hung test fails instead of stalling CI. Override per test with @pytest.mark.timeout(n).
timeout = 120
